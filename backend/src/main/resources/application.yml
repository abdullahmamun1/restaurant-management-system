spring:
  application:
    name: restaurant-system

  # Local, gitignored overrides (Neon credentials) are pulled in here if present.
  # See application-local.yml.example for the template.
  config:
    import: optional:classpath:application-local.yml

  datasource:
    # NeonDB (serverless PostgreSQL) — SSL is required. Provide these via
    # application-local.yml or the DB_URL / DB_USERNAME / DB_PASSWORD env vars.
    # URL form: jdbc:postgresql://<endpoint>.<region>.aws.neon.tech/<db>?sslmode=require
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    # Flyway owns the schema; Hibernate must never mutate it, only validate against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  billing:
    # Fractions, not percentages: 0.05 = 5%. Both apply to the subtotal and do not compound.
    # Negative values fail the application at startup (see BillingProperties).
    tax-rate: ${BILLING_TAX_RATE:0.05}
    service-charge-rate: ${BILLING_SERVICE_CHARGE_RATE:0.10}
  reporting:
    # The RESTAURANT's local timezone, not the server's. Report date ranges (FR-23, FR-24) are
    # calendar days here: at +06 a payment taken at 19:30 UTC belongs to the next local day's
    # sales. An unknown zone id fails the application at startup. See DateRange / M7 D2.
    zone: ${REPORTING_ZONE:Asia/Dhaka}
  cors:
    # Comma-separated origins allowed to call the API (the Angular dev client by default).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      # HS256 signing secret — MUST be >= 32 bytes. Override with a real secret (JWT_SECRET
      # env var or application-local.yml) in any shared/deployed environment.
      secret: ${JWT_SECRET:dev-only-change-me-restaurant-system-jwt-secret-key-32b+}
      # Token lifetime in minutes (480 = one 8-hour shift).
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

logging:
  level:
    com.restaurant: INFO
